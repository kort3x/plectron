<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Plectron</title>
  <link rel="icon" href="logo.svg" type="image/svg+xml">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="app">
    <header class="topbar">
      <button class="icon-btn menu-btn" id="menu-btn" aria-label="Toggle tool list">
        <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><path d="M4 6h16M4 12h16M4 18h16" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
      </button>
      <a class="brand" href="#/">
        <img src="logo.svg" width="26" height="26" alt="">
        <span>Plectron</span>
      </a>
      <div class="search">
        <svg viewBox="0 0 24 24" width="16" height="16" aria-hidden="true"><circle cx="11" cy="11" r="7" fill="none" stroke="currentColor" stroke-width="2"/><path d="M20 20l-3.5-3.5" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
        <input id="search" type="search" placeholder="Search tools" autocomplete="off" aria-label="Search tools">
        <kbd>/</kbd>
      </div>
      <nav class="topnav">
        <a href="#/history" data-nav="history">History</a>
        <button class="icon-btn" id="theme-btn" aria-label="Toggle theme" title="Toggle theme">
          <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path d="M12 3a9 9 0 1 0 9 9 7 7 0 0 1-9-9z" fill="currentColor"/></svg>
        </button>
      </nav>
    </header>
    <aside class="sidebar" id="sidebar">
      <div class="tool-list" id="tool-list"></div>
      <footer class="sidebar-foot" id="sidebar-foot"></footer>
    </aside>
    <main class="main" id="main"></main>
  </div>
  <script type="module" src="app.js"></script>
</body>
</html>
